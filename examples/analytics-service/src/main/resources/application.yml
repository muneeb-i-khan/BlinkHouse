spring:
  application:
    name: analytics-service

blinkhouse:
  url: "http://localhost:8123"
  username: default
  password: ""
  database: analytics
  schema:
    mode: CREATE_IF_MISSING
  pool:
    max-total: 200
    max-per-route: 50
    connect-timeout: 5s
    socket-timeout: 60s
    idle-evict-after: 30s
    evictor-interval: 5s
    validate-after-inactivity: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    io.blinkhouse: INFO
