name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # -----------------------------------------------------------------------
  # Job 1: Build + unit tests (no Docker, fast feedback)
  # -----------------------------------------------------------------------
  build:
    name: Build & Unit Tests (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: [ "17", "21" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Build and run unit tests
        run: mvn -B verify -DskipITs checkstyle:check

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  # -----------------------------------------------------------------------
  # Job 2: Integration tests (Docker required, runs after build passes)
  # -----------------------------------------------------------------------
  integration-tests:
    name: Integration Tests (ClickHouse ${{ matrix.clickhouse-version }}, JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        clickhouse-version: [ "24.3", "24.8", "25.1" ]
        java: [ "17", "21" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Pull ClickHouse image
        run: docker pull clickhouse/clickhouse-server:${{ matrix.clickhouse-version }}

      - name: Run integration tests
        env:
          BH_CLICKHOUSE_IMAGE: clickhouse/clickhouse-server:${{ matrix.clickhouse-version }}
        run: mvn -B verify -pl blinkhouse-core,blinkhouse-spring -Dcheckstyle.skip=true

      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports-ch${{ matrix.clickhouse-version }}
          path: '**/target/failsafe-reports/'
          retention-days: 7

  # -----------------------------------------------------------------------
  # Job 3: Verify benchmark module compiles (no full JMH run in CI)
  # -----------------------------------------------------------------------
  benchmark-compile:
    name: Benchmark Compile Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install parent + core
        run: mvn -B install -pl .,blinkhouse-core -DskipTests -Dcheckstyle.skip=true
        env:
          MAVEN_OPTS: "-Dmaven.wagon.httpconnectionManager.ttlSeconds=25 -Dmaven.wagon.http.retryHandler.count=3"

      - name: Compile benchmark module
        run: mvn -B compile -pl blinkhouse-benchmark -Dcheckstyle.skip=true
        env:
          MAVEN_OPTS: "-Dmaven.wagon.httpconnectionManager.ttlSeconds=25 -Dmaven.wagon.http.retryHandler.count=3"
